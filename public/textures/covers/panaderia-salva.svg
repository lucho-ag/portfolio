<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="crust" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#F1DDB0"/>
      <stop offset="1" stop-color="#D9B77A"/>
    </radialGradient>
    <pattern id="flour" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="6" r="1.6" fill="#FFF6E2" opacity="0.7"/>
      <circle cx="16" cy="18" r="1.2" fill="#FFF6E2" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#crust)"/>
  <rect width="1024" height="1024" fill="url(#flour)"/>
  <!-- Hogaza de masa madre con greñas. -->
  <g transform="translate(250 560) rotate(-12)">
    <ellipse cx="0" cy="0" rx="150" ry="95" fill="#8B4A1F"/>
    <ellipse cx="0" cy="-12" rx="140" ry="80" fill="#A8602A"/>
    <path d="M-95 -20 Q-60 -55 -25 -20 M-35 -30 Q0 -65 35 -30 M25 -20 Q60 -55 95 -20" stroke="#F1DDB0" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Espigas. -->
  <g stroke="#7A4A22" stroke-width="6" fill="#B5823F" transform="translate(800 600) rotate(18)">
    <line x1="0" y1="-120" x2="0" y2="120"/>
    <ellipse cx="-18" cy="-80" rx="12" ry="24" transform="rotate(-25 -18 -80)"/>
    <ellipse cx="18" cy="-60" rx="12" ry="24" transform="rotate(25 18 -60)"/>
    <ellipse cx="-18" cy="-35" rx="12" ry="24" transform="rotate(-25 -18 -35)"/>
    <ellipse cx="18" cy="-10" rx="12" ry="24" transform="rotate(25 18 -10)"/>
  </g>
  <text x="512" y="235" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="70" fill="#5A2E12">Panadería</text>
  <text x="512" y="310" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="76" letter-spacing="8" fill="#3B1D0A">SALVA</text>
  <text x="512" y="800" text-anchor="middle" font-family="Georgia, serif" font-size="32" letter-spacing="4" fill="#5A2E12">MASA MADRE · ZONA SUR</text>
  <text x="512" y="860" text-anchor="middle" font-family="Courier New, monospace" font-size="26" fill="#7A4A22">pedidos por WhatsApp</text>
</svg>
